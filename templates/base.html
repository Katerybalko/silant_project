<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Мой Силант{% endblock %}</title>
  {% load static %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Навигация -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <img src="{% static 'img/logo.png' %}" alt="Логотип Силант" height="50" class="me-2">
        <span class="fw-bold">Мой Силант</span>
      </a>
      <div>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="/" class="nav-link">Главная</a></li>
          {% if user.is_authenticated %}
            <li class="nav-item"><a href="/dashboard/" class="nav-link">Личный кабинет</a></li>
            <li class="nav-item"><a href="/accounts/logout/" class="nav-link text-danger">Выйти</a></li>
          {% else %}
            <li class="nav-item"><a href="/accounts/login/" class="nav-link">Войти</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <!-- Контент -->
  <main class="container mb-5 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Футер -->
  <footer class="bg-light text-center text-muted py-3 mt-auto border-top">
    <div class="container">
      <small>© {% now "Y" %} ООО «Силант-Сервис». Все права защищены.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
